<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: linear-gradient(135deg, #4f46e5, #06b6d4);
                color: #111827;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .login-card {
                background: rgba(255, 255, 255, 0.95);
                border-radius: 20px;
                box-shadow: 0 18px 50px rgba(15, 23, 42, 0.2);
                width: 100%;
                max-width: 400px;
                padding: 32px;
                text-align: center;
            }

            .login-card h1 {
                margin: 0 0 12px;
                font-size: 1.9rem;
            }

            .login-card p {
                margin: 0 0 28px;
                color: #6b7280;
            }

            .form-group {
                margin-bottom: 18px;
                text-align: left;
            }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                font-weight: 600;
                color: #111827;
            }

            .form-group input {
                width: 100%;
                padding: 12px 14px;
                border: 1px solid #d1d5db;
                border-radius: 12px;
                font-size: 1rem;
                transition: border-color 0.2s ease;
            }

            .form-group input:focus {
                border-color: #4f46e5;
                outline: none;
                box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
            }

            .login-button {
                width: 100%;
                padding: 14px;
                border: none;
                border-radius: 14px;
                background: #4f46e5;
                color: white;
                font-size: 1rem;
                font-weight: 700;
                cursor: pointer;
                transition: transform 0.2s ease, background 0.2s ease;
            }

            .login-button:hover {
                background: #4338ca;
                transform: translateY(-1px);
            }

            .login-note {
                margin-top: 16px;
                color: #6b7280;
                font-size: 0.95rem;
            }
        </style>
    </head>

    <body>
        <section class="login-card">
            <h1>Iniciar sesión</h1>
            <p>Ingresa tu correo y contraseña para continuar.</p>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input id="email" type="email" placeholder="tucorreo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" type="password" placeholder="********" required>
            </div>

            <button class="login-button" type="submit">Ingresar</button>
            <p class="login-note">Esto es solo un diseño de login; no envía datos en realidad.</p>
        </section>
    </body>
</html>
'@
